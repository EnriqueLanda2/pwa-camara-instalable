<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspección Visual PWA</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <h1>Inspección Visual</h1>
  <p>Enrique Landa</p>

  <button id="btn-instalar" hidden>Instalar App</button>

  <p id="instrucciones-ios" hidden>
    Para instalar en iPhone, pulsa el icono Compartir y selecciona "Agregar a inicio".
  </p>

  <p id="mensaje-estado">Cámara apagada.</p>

  <video id="visor-camara" autoplay playsinline muted></video>

  <button id="btn-preparar-camara">Solicitar Acceso a Cámara</button>
  <button id="btn-encender-camara" hidden>Encender Cámara</button>

  <div id="aviso-permiso" hidden>
    <p>Esta aplicación requiere acceso a tu cámara únicamente para mostrar una vista previa local en pantalla. Ninguna imagen se envía a servidores externos.</p>
    <button id="btn-confirmar-permiso">Aceptar y Encender Cámara</button>
  </div>

  <div id="controles" hidden>
    <button id="btn-alternar-camara">Cambiar Cámara</button>
    <button id="btn-apagar-camara">Apagar Cámara</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
